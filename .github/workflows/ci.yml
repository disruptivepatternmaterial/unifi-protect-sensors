name: CI

# Runs on every push and pull request so a broken integration can never be
# tagged for release: the release workflow only fires on a tag, and a tag is
# only worth cutting from a commit that passed here.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio ruff aiohttp voluptuous

      - name: Lint
        run: ruff check custom_components/ tests/

      - name: Test
        run: pytest tests/ -q

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand registration lives in the home-assistant/brands repo and is a
          # separate submission; it is not a blocker for a custom repository.
          ignore: brands
